# NÃO faz parte do workspace LUMYX (raiz tem `exclude = ["spike"]`). Protótipo descartável.
[package]
name = "lumyx-spike-leptos"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d", "Performance",
] }
console_error_panic_hook = "0.1"
