[workspace]
resolver = "2"
members = [
    "crates/led-core",
    "crates/led-hal",
    "crates/led-protocols",
    "crates/led-layout",
    "crates/led-pixel-engine",
    "crates/led-sequencer",
    "crates/led-audio",
    "crates/led-demo",
    "crates/audio-core",
    "crates/led-bridge",
    "crates/led-show-recorder",
    "crates/led-xlights",
    "crates/led-player",
    "crates/led-readmodel",
    "crates/led-hardware-profile",
    "integration-tests",
]
# Throwaway UI-stack spike (ADR-0016). Excluded so its Leptos Cargo.toml never joins the
# workspace or the CI `cargo test --workspace`. Not part of the production baseline.
exclude = ["spike"]

[workspace.package]
edition = "2021"
license = "MIT"
