# [MEDIÇÃO] TD-030 — NÃO MERGEAR. Ramo descartável measure/td030-fix-fecho sobre fabf87e (correção).
# F = led-pixel-engine da correção (fabf87e); C = pré-correção 28be05e (ArcSwap + teste de isolamento) = controlo negativo.
# N=1000 execuções INTERCALADAS (F, C, F, C…), filtro reactive::adversarial_tests, saída por iteração.
name: measure-td030-fix

on:
  pull_request:

jobs:
  fecho:
    name: fecho (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Deps de áudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build de F (correção) e C (pré-correção 28be05e)
        shell: bash {0}
        run: |
          pick() { python3 -c 'import json,sys
          for l in open(sys.argv[1]):
              try: m=json.loads(l)
              except: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="led_pixel_engine" and m["profile"]["test"]: print(m["executable"])' "$1" | head -1; }
          git log --oneline -1 fabf87e; git log --oneline -1 28be05e
          cargo test -p led-pixel-engine --lib --locked --no-run --message-format=json > build-f.json 2> build-f.err; echo "build_f_exit=$?"
          git worktree add ../pre 28be05e
          (cd ../pre && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../t-pre cargo test -p led-pixel-engine --lib --locked --no-run --message-format=json > $GITHUB_WORKSPACE/build-c.json 2> $GITHUB_WORKSPACE/build-c.err); echo "build_c_exit=$?"
          F=$(pick build-f.json); C=$(pick build-c.json)
          echo "F=$F" >> $GITHUB_ENV; echo "C=$C" >> $GITHUB_ENV; echo "F=$F C=$C"
          grep -c arc_swap build-c.json; grep -c arc_swap build-f.json
      - name: N=1000 intercalado
        shell: bash {0}
        run: |
          uname -m; sysctl -n machdep.cpu.brand_string 2>/dev/null || grep -m1 'model name' /proc/cpuinfo || true
          bash .github/measure-td030-fix/intercalado-fecho.sh "$F" "$C" 1000 out
          echo "== F: pânicos (primeiros 10)"; grep -ah 'panicked at\|violated\|violado' out/F/it-*.out | head -10
          echo "== C: pânicos (primeiros 10)"; grep -ah 'coherence violated\|isolamento violado' out/C/it-*.out | head -10 | cut -c1-300
          echo "RESULTADO td030-fecho os=${{ matrix.os }} arch=$(uname -m) $(tr '\n' ' ' < out/RESUMO.txt)"
