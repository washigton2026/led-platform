# [MEDICAO] TD-038 §2, linha de base do «antes» — NÃO FAZER MERGE. Ramo descartável measure/td038-linha-de-base sobre
# origin/main ef0f1f2. O PR é de medição e fecha sem merge.
# Accept: ~/lumyx-evidence/2026-11-26-td038/accept-v2.md (§2; v1 aprovado, v2 para aprovação). Corre SÓ os 5 testes da
# classe (T1–T5: os dois com «> 0» e os do inventário com contador) com --exact --nocapture, N=30 (≥20) por SO, e grava as
# linhas TD030_FRESCURA / TD030_FALLBACKS / SEQLOCK_FRESCURA (os jobs verdes do ci.yml não as mostram: sem --nocapture).
# Regra do proprietário (2026-11-27): NESTE PR, uma falha no windows de um teste da classe é objeto da medição — vai
# para o flakes.log, sem STOP.
# Um FAILED aqui é DADO da linha de base, não falha do job: o job só reprova se a medição for inválida
# (binário não encontrado, N listado ≠ 1, iterações ≠ N, ok+FAILED ≠ N).
# T3/T4 (Q1 do accept v3): o contador é impresso por um patch aplicado AQUI, no runner (git apply, como os canários do
# miri (seqlock)); o reactive.rs deste ramo é o da main, sem commit de instrumentação.
# Não toca no ci.yml (vigiado pelo TD-027). runs-on do windows = o do job windows (allow-failure) do ci.yml: windows-latest.
name: measure-td038-linha-de-base

on:
  pull_request:

jobs:
  linha-de-base:
    name: TD-038 linha de base (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Instrumentação de T3/T4 (patch em runtime, sem commit)
        shell: bash {0}
        run: |
          P=.github/measure-td038/instrumenta-t3-t4.patch
          git apply --check "$P" || { echo "::error::o patch de instrumentação já não aplica ao reactive.rs — medição inválida"; exit 1; }
          git apply "$P"; echo "apply_exit=$?"
          git diff --stat
          n=$(grep -c 'TD038_T[34]' crates/led-pixel-engine/src/reactive.rs)
          [ "$(git diff --name-only)" = crates/led-pixel-engine/src/reactive.rs ] && [ "$n" -eq 2 ] || { echo "::error::instrumentação inesperada (ficheiros: $(git diff --name-only | tr '\n' ' '), marcas: $n)"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Deps de áudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build do binário de teste do led-pixel-engine (--lib)
        shell: bash {0}
        run: |
          rustc --version; git log --oneline -1
          cargo test -p led-pixel-engine --lib --locked --no-run --message-format=json > build.json 2> build.err; code=$?
          echo "build_exit=$code"; [ "$code" -eq 0 ] || { cat build.err; exit 1; }
          PY=$(command -v python3 || command -v python); echo "PY=$PY"
          BIN=$("$PY" -c 'import json,sys
          for l in open(sys.argv[1]):
              try: m=json.loads(l)
              except Exception: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="led_pixel_engine" and m["profile"]["test"]: print(m["executable"])' build.json | tr -d '\r' | head -1)
          [ -n "$BIN" ] || { echo "::error::binário de teste do led_pixel_engine não encontrado — medição inválida"; exit 1; }
          [ "$RUNNER_OS" = Windows ] && BIN=$(cygpath -u "$BIN")
          echo "BIN=$BIN" >> $GITHUB_ENV; echo "BIN=$BIN"
      - name: T1–T5, N=30 execuções cada, --exact --nocapture
        shell: bash {0}
        run: |
          uname -m; uname -s
          bash .github/measure-td038/medir.sh "$BIN" 30 out
          code=$?
          echo "RESULTADO td038-linha-de-base os=${{ matrix.os }} arch=$(uname -m) $(tr '\n' ' ' < out/RESUMO.txt 2>/dev/null)"
          exit $code
