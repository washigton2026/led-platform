# [MEDIÇÃO] TD-030 — NÃO MERGEAR. Ramo descartável measure/td-002-arm64 (ordem R5.1 passo B).
#
# Corre SÓ o detetor de coerência do TD-002 em ciclo (N=500), num binário compilado uma vez,
# em arm64 (macos-26, ubuntu-24.04-arm) e x86_64 (ubuntu-24.04), e conta as falhas.
# Cada iteração escreve para ficheiro e o exit é lido sem pipe (KB-013). A premissa N_executado
# == 1 por iteração é verificada (um filtro errado daria 0 testes e 0 falhas — KB-012).
name: measure-td030

on:
  pull_request:

jobs:
  coerencia:
    name: td030 coerencia (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    env:
      N: 500
      TESTE: reactive::adversarial_tests::audioshare_scalars_beat_timestamp_coherent_under_concurrency
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Arquitetura
        run: uname -a && uname -m && rustc -vV
      - name: Compilar o binário de testes (uma vez)
        shell: bash {0}
        run: |
          cargo test -p led-pixel-engine --lib --locked --no-run --message-format=json > build.json 2> build.err
          code=$?
          tail -5 build.err
          [ "$code" -eq 0 ] || exit 1
          BIN=$(grep -o '"executable":"[^"]*"' build.json | grep led_pixel_engine | head -1 | sed 's/"executable":"//; s/"$//')
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "binário: $BIN"
      - name: Ciclo N=500
        shell: bash {0}
        run: |
          falhas=0; executados=0; vacuas=0
          for i in $(seq 1 "$N"); do
            "$BIN" --exact "$TESTE" > it.txt 2>&1
            code=$?
            n=$(sed -nE 's/^test result: [a-zA-Z]+\. ([0-9]+) passed; ([0-9]+) failed.*/\1+\2/p' it.txt | head -1)
            tot=$(( ${n:-0} ))
            if [ "$tot" -ne 1 ]; then vacuas=$((vacuas+1)); fi
            executados=$((executados+tot))
            if [ "$code" -ne 0 ]; then
              falhas=$((falhas+1))
              echo "::warning::iteração $i FALHOU (exit $code)"
              grep -aE 'panicked at|coherence violated' it.txt | head -3
            fi
          done
          echo "RESULTADO td030 os=${{ matrix.os }} arch=$(uname -m) N=$N executados=$executados vacuas=$vacuas falhas=$falhas"
          [ "$vacuas" -eq 0 ] || { echo "premissa falhou: iterações sem exatamente 1 teste"; exit 1; }
