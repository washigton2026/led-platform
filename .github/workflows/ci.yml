# LUMYX CI — porta os gates locais (build + test + clippy) para GitHub Actions.
#
# Alvos: Linux (output ao vivo) e macOS (autoria/referência) são BLOQUEANTES.
# Windows é suporte (`continue-on-error`) e NÃO orienta a arquitetura (ADR-0013).
#
# Notas de evidência:
# - `gpu` é feature opt-in (hardware-gated); a CI roda SEM ela (default features).
# - `audio-core` usa `cpal` → o runner Linux precisa de `libasound2-dev` (ALSA).
# - Toolchain = `stable` (o repo não pina). Clippy pode acusar lints novos num bump de
#   toolchain (drift já observado com rust-1.96.0) — isso é sinal real, não falso-vermelho.
name: CI

on:
  push:
    branches: [main, "baseline/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Bloqueante: plataformas validadas de output/autoria ──────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Deps de áudio no Linux (cpal → ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build (sem feature gpu — hardware-gated)
        run: cargo build --workspace --all-targets --locked
      - name: Test
        # `bash {0}` (sem -e): o padrao do GitHub e `bash -eo pipefail`, que mata o step no
        # pipeline que falha — antes do diagnostico rodar. Mesma classe do KB-013 deste repo.
        shell: bash {0}
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # A CI que falha sem dizer QUAL teste falhou é uma CI ruim. Emitimos anotações
            # com file/line (extraídas do local do panic) porque essas aparecem mesmo para
            # quem não está autenticado — logs e job summary exigem login.
            echo "::group::falhas"
            grep -aE '^test .* FAILED|panicked at|^\s+left:|^\s+right:' test-output.txt | head -40
            echo "::endgroup::"
            grep -aoE 'panicked at [^:]+:[0-9]+:[0-9]+' test-output.txt | sort -u | head -10 | \
              while IFS= read -r loc; do
                f=$(echo "$loc" | sed -E 's/panicked at ([^:]+):([0-9]+):.*/\1/')
                l=$(echo "$loc" | sed -E 's/panicked at ([^:]+):([0-9]+):.*/\2/')
                printf '::error file=%s,line=%s::teste falhou aqui (${{ matrix.os }})\n' "$f" "$l"
              done
            grep -aE '^test .* FAILED' test-output.txt | head -10 | \
              while IFS= read -r t; do printf '::error::%s\n' "$t"; done
          fi
          exit $code
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ── Bloqueante: o contrato TypeScript tem de COMPILAR ────────────────────────
  #
  # Job próprio, e não um step do `test`, por duas razões:
  #
  # 1. **É independente do SO.** `tsc` produz o mesmo veredito em Linux e macOS; correr na
  #    matriz duplicaria o custo sem acrescentar sinal.
  # 2. **É uma propriedade diferente.** O `test` já corre o gate Rust↔TS
  #    (`contract_gate.rs`), que prova que o `.ts` **corresponde** ao Rust. Este prova que
  #    ele **compila**. São independentes: um ficheiro pode bater byte a byte com o gerador
  #    e não compilar (ADR-0027, Emenda 1). Duas propriedades, dois jobs.
  #
  # Node **não** entra no job do Rust de propósito: `cargo test` não pode passar a depender
  # de um segundo toolchain, senão a suíte falha em máquinas que só têm Rust.
  contract:
    name: contrato TS (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 (LTS) explícito
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # OS DOIS lockfiles. Com só um, a chave de cache ignoraria mudanças nas
          # dependências do `console-web` e o runner podia restaurar um cache desatualizado.
          cache-dependency-path: |
            crates/led-console-bin/contract/package-lock.json
            console-web/package-lock.json
      # `npm ci` e não `npm install`: instala **exatamente** o lockfile e falha se ele
      # divergir do `package.json`. `install` poderia resolver uma versão diferente da
      # pinada, e o gate deixaria de correr contra o que está versionado.
      - name: npm ci (lockfile exato) — contrato
        working-directory: crates/led-console-bin/contract
        run: npm ci
      # A app entra no MESMO job: `tsc` produz o mesmo veredito em qualquer SO, e o gate
      # exige os dois projectos. Instalar aqui é o que torna o `tsc_gate.sh` reproduzível
      # sem ele ter de instalar nada por sua conta durante a CI.
      - name: npm ci (lockfile exato) — console-web
        working-directory: console-web
        run: npm ci
      # O **mesmo** comando que corre localmente. Se a CI corresse um comando próprio, a
      # reprodução local deixaria de provar o que a CI prova.
      #
      # O script invoca o binário de `node_modules/typescript` diretamente — nunca
      # `npx tsc`, porque no registo npm o pacote `tsc` é um stub antigo (2.0.4) que não é
      # o TypeScript. Verificado, não presumido.
      - name: Gate de compilação do contrato
        run: ./scripts/tsc_gate.sh

  # ── Não-bloqueante: Windows é suportado, mas não conduz o design ─────────────
  windows:
    name: windows (allow-failure)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
