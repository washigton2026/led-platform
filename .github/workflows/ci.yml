# LUMYX CI — porta os gates locais (build + test + clippy) para GitHub Actions.
#
# Alvos: Linux (output ao vivo) e macOS (autoria/referência) são BLOQUEANTES.
# Windows é suporte (`continue-on-error`) e NÃO orienta a arquitetura (ADR-0013).
#
# Notas de evidência:
# - `gpu` é feature opt-in (hardware-gated); a CI roda SEM ela (default features).
# - `audio-core` usa `cpal` → o runner Linux precisa de `libasound2-dev` (ALSA).
# - Toolchain = `stable` (o repo não pina). Clippy pode acusar lints novos num bump de
#   toolchain (drift já observado com rust-1.96.0) — isso é sinal real, não falso-vermelho.
# - EXCEPÇÃO ao ponto acima: o job `miri` pina o nightly. Ali o drift NÃO é sinal — é ruído
#   sobre um gate de segurança de memória, e um gate ruidoso é um gate ignorado.
name: CI

on:
  push:
    branches: [main, "baseline/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Bloqueante: plataformas validadas de output/autoria ──────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Deps de áudio no Linux (cpal → ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build (sem feature gpu — hardware-gated)
        run: cargo build --workspace --all-targets --locked
      - name: Test
        # `bash {0}` (sem -e): o padrao do GitHub e `bash -eo pipefail`, que mata o step no
        # pipeline que falha — antes do diagnostico rodar. Mesma classe do KB-013 deste repo.
        shell: bash {0}
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # A CI que falha sem dizer QUAL teste falhou é uma CI ruim. Emitimos anotações
            # com file/line (extraídas do local do panic) porque essas aparecem mesmo para
            # quem não está autenticado — logs e job summary exigem login.
            echo "::group::falhas"
            grep -aE '^test .* FAILED|panicked at|^\s+left:|^\s+right:' test-output.txt | head -40
            echo "::endgroup::"
            grep -aoE 'panicked at [^:]+:[0-9]+:[0-9]+' test-output.txt | sort -u | head -10 | \
              while IFS= read -r loc; do
                f=$(echo "$loc" | sed -E 's/panicked at ([^:]+):([0-9]+):.*/\1/')
                l=$(echo "$loc" | sed -E 's/panicked at ([^:]+):([0-9]+):.*/\2/')
                printf '::error file=%s,line=%s::teste falhou aqui (${{ matrix.os }})\n' "$f" "$l"
              done
            grep -aE '^test .* FAILED' test-output.txt | head -10 | \
              while IFS= read -r t; do printf '::error::%s\n' "$t"; done
          fi
          exit $code
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ── Bloqueante: o contrato TypeScript tem de COMPILAR ────────────────────────
  #
  # Job próprio, e não um step do `test`, por duas razões:
  #
  # 1. **É independente do SO.** `tsc` produz o mesmo veredito em Linux e macOS; correr na
  #    matriz duplicaria o custo sem acrescentar sinal.
  # 2. **É uma propriedade diferente.** O `test` já corre o gate Rust↔TS
  #    (`contract_gate.rs`), que prova que o `.ts` **corresponde** ao Rust. Este prova que
  #    ele **compila**. São independentes: um ficheiro pode bater byte a byte com o gerador
  #    e não compilar (ADR-0027, Emenda 1). Duas propriedades, dois jobs.
  #
  # Node **não** entra no job do Rust de propósito: `cargo test` não pode passar a depender
  # de um segundo toolchain, senão a suíte falha em máquinas que só têm Rust.
  contract:
    name: contrato TS (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 (LTS) explícito
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # OS DOIS lockfiles. Com só um, a chave de cache ignoraria mudanças nas
          # dependências do `console-web` e o runner podia restaurar um cache desatualizado.
          cache-dependency-path: |
            crates/led-console-bin/contract/package-lock.json
            console-web/package-lock.json
      # `npm ci` e não `npm install`: instala **exatamente** o lockfile e falha se ele
      # divergir do `package.json`. `install` poderia resolver uma versão diferente da
      # pinada, e o gate deixaria de correr contra o que está versionado.
      - name: npm ci (lockfile exato) — contrato
        working-directory: crates/led-console-bin/contract
        run: npm ci
      # A app entra no MESMO job: `tsc` produz o mesmo veredito em qualquer SO, e o gate
      # exige os dois projectos. Instalar aqui é o que torna o `tsc_gate.sh` reproduzível
      # sem ele ter de instalar nada por sua conta durante a CI.
      - name: npm ci (lockfile exato) — console-web
        working-directory: console-web
        run: npm ci
      # O **mesmo** comando que corre localmente. Se a CI corresse um comando próprio, a
      # reprodução local deixaria de provar o que a CI prova.
      #
      # O script invoca o binário de `node_modules/typescript` diretamente — nunca
      # `npx tsc`, porque no registo npm o pacote `tsc` é um stub antigo (2.0.4) que não é
      # o TypeScript. Verificado, não presumido.
      - name: Gate de compilação do contrato
        run: ./scripts/tsc_gate.sh

  # ── Bloqueante: o debt gate (KB-012) também na CI, não só no hook local ─────
  #
  # Porque existe: o PR #6 mergeou na `main` com o `audit_gate.py` VERMELHO (TD-020 stale,
  # 2026-09-26). O gate só corria no pre-commit local, e o hook não vê a alteração do
  # próprio commit que a torna stale. A CI era o único sítio que a podia apanhar — e não
  # corria o gate.
  #
  # `fetch-depth: 0` é OBRIGATÓRIO, não optimização. O detector de evidência stale corre
  # `git log <hash>..HEAD -- <ficheiro>` e ignora o returncode: num checkout raso o `<hash>`
  # não existe, o `git log` falha, o stdout vem vazio e o stale passa a VERDE em silêncio.
  debt-gate:
    name: debt gate (audit_gate.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: audit_gate.py (exit lido sem pipe — KB-013)
        shell: bash {0}
        run: |
          python3 scripts/audit_gate.py > debt-gate.txt 2>&1
          code=$?
          cat debt-gate.txt
          # KB-012: um gate que não viu nenhum TD passa por vacuidade. Exigir N > 0.
          n=$(grep -aoE '— [0-9]+ TD entries' debt-gate.txt | grep -oE '[0-9]+')
          echo "debt-gate: ${n:-0} TD lidos, exit ${code}"
          if [ "${n:-0}" -eq 0 ]; then echo "debt-gate: 0 TD lidos — o gate não viu nada"; exit 1; fi
          exit $code

  # ── Bloqueante: as construções `unsafe` do triple buffer, sob Miri ───────────
  #
  # Job próprio, e não um step da matriz `test`, pela MESMA razão que o `contract`:
  # a matriz corre `@stable` e o Miri exige `nightly`. Enxertá-lo ali poria um segundo
  # toolchain no caminho do `cargo test`, que é precisamente o que o comentário do job
  # `contract` (acima) recusa fazer com o Node.
  #
  # O que este job protege, e porque é bloqueante: `led-triple` concentra as **5
  # construções `unsafe`** do handoff render→send (3 `unsafe impl` + 2 blocos `unsafe {}`).
  # Elas sustentam o invariante do `CLAUDE.md` *"render and send never share a mutable
  # buffer"*. Uma regressão ali é UB em produção, não um lint — e `cargo test` não a vê.
  # Antes deste job, a cobertura vivia só no `~/lumyx-e2e.sh --miri`, opt-in e fora do repo.
  #
  # `led-triple` tem ZERO dependências (`cargo tree -p led-triple` é uma linha), por isso
  # este job não precisa do `libasound2-dev` que o job `test` instala no Linux.
  miri:
    name: miri (led-triple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly PINADO, e não `@nightly`. CORRECÇÃO (run #82): a versão anterior deste
      # comentário dizia que o pino era "o toolchain exacto que produziu a evidência local".
      # Era FALSO — o canal datado `nightly-2026-06-02` empacota o master de 2026-06-01
      # (`rustc 1.98.0-nightly 6bdf43094`, lido no log do #82), enquanto o local é
      # `d595fce01` de 2026-06-02. A data no `rustc --version` é a do COMMIT, não a do canal.
      # O gate passou nos DOIS, o que é evidência mais forte do que num só. O nightly muda todos os
      # dias e este repo JÁ foi partido por drift de toolchain (`chunks_exact_to_as_chunks`
      # deixou a baseline vermelha sem regressão nenhuma). Um gate de segurança de memória
      # que fica vermelho por razão alheia é um gate que a equipa aprende a ignorar.
      # Subir o pino é uma decisão deliberada, com re-execução — nunca um acidente de data.
      - name: Rust nightly PINADO + miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-02
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          # Chave própria: este job usa outro toolchain e outro target-dir (`target/miri`).
          key: miri
      # Evidência do toolchain NO LOG. O §10 do protocolo exige registar plataforma e
      # toolchain; lê-los do log é mais forte do que confiar no que o YAML pediu.
      - name: Toolchain efetivo (evidência, não suposição)
        run: rustc --version && cargo miri --version
      - name: Miri — led-triple
        # `bash {0}` (sem -e), pela mesma razão do job `test`: o default do GitHub é
        # `bash -eo pipefail`, que mata o step no pipeline e leva o diagnóstico com ele.
        shell: bash {0}
        run: |
          # Toolchain EXPLÍCITO no `+`, e não herdado do default que a action define: o
          # veredito não deve depender de um efeito colateral da instalação. É o mesmo
          # comando do `CLAUDE.md:24` (`cargo +nightly miri test -p led-triple`), com o
          # selector resolvido para a data pinada — localmente o default é `stable`, aqui
          # não há default em que confiar.
          cargo +nightly-2026-06-02 miri test -p led-triple 2>&1 | tee miri-output.txt
          code=${PIPESTATUS[0]}   # o exit do CARGO, nunca o do `tee` (KB-013)

          # KB-012 — o gate tem de saber reprovar. `test result: ok` é satisfeito por
          # "ok. 0 passed; N filtered out", portanto um filtro errado (ou um crate
          # renomeado) daria VERDE sem executar uma única construção `unsafe`. Foi
          # exactamente essa a falha encontrada em 2026-09-19 no Invariante 4 do
          # `lumyx-e2e.sh`. Aqui exigimos N > 0, extraído do agregado.
          passed=$(grep -aoE 'test result: ok\. [0-9]+ passed' miri-output.txt \
                   | grep -aoE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          if [ "$code" -eq 0 ] && [ "$passed" -eq 0 ]; then
            echo "::error::Miri saiu 0 mas executou 0 testes — falso-verde (KB-012)."
            exit 1
          fi

          if [ "$code" -ne 0 ]; then
            echo "::group::miri"
            grep -aE 'Undefined Behavior|data race|test result: FAILED|^error' miri-output.txt | head -40
            echo "::endgroup::"
            grep -aoE 'Undefined Behavior: [^\n]+' miri-output.txt | head -5 | \
              while IFS= read -r ub; do printf '::error::%s\n' "$ub"; done
          fi
          echo "miri: ${passed} testes executados, exit ${code}"
          exit $code
      - name: Miri — audio-core (ring buffer SPSC, TD-027)
        # As 3 construções `unsafe` do `audio-core` vivem em `ring_buffer.rs` (:24, :55, :75).
        # O crate inteiro sob Miri não cabe num job (>56 min medidos a 2026-10-03); o módulo
        # cabe (~22 s locais). Um filtro reabre o falso-verde do KB-012, portanto:
        #   - N_esperado vem de `-- --list` com o MESMO toolchain e filtro (não de grep na fonte,
        #     que erra com `#[ignore]`, macros e módulos homónimos);
        #   - N_executado vem do resumo do Miri, em ficheiro (KB-013);
        #   - exige N_executado == N_esperado e N_esperado >= 5 (o valor medido): o piso apanha
        #     o módulo renomeado ou testes removidos, que a igualdade sozinha deixaria passar;
        #   - `#[ignore]` no módulo reprova: ninguém retira cobertura em silêncio.
        shell: bash
        run: |
          set -euo pipefail
          MOD=crates/audio-core/src/ring_buffer.rs
          FILTRO='ring_buffer::tests::'
          PISO=5
          # Resultados fora da árvore: num checkout local não sujam o repo nem entram num `git add`.
          OUT="${RUNNER_TEMP:-$(mktemp -d)}"
          if grep -nE '#\[ignore|cfg_attr\(.*miri.*ignore' "$MOD"; then
            echo "::error::$MOD tem testes ignorados — o gate do TD-027 não aceita cobertura retirada em silêncio."
            exit 1
          fi
          # Saltar o corpo sob Miri (`if cfg!(miri) { return; }`, `#[cfg(not(miri))]`, iters=0, ou um
          # `const` com `cfg!(miri)` noutro ficheiro do crate) tira a cobertura sem `#[ignore]` e sem
          # mudar a contagem — falsificado (X8b, Y5a, Y5b). Regra: em TODO o crate (src, tests,
          # build.rs, Cargo.toml), sem distinguir maiúsculas, a única linha de código que menciona
          # miri é a que reduz o trabalho do teste SPSC — comparada pela linha INTEIRA, não por
          # substring. Comentários `//` não executam e ficam de fora.
          # Configuração de fora do crate manda no próprio Miri: um `.cargo/config*` com `[env]
          # MIRIFLAGS="-Zmiri-disable-data-race-detector"` deu verde sobre um data race real (W4).
          # O passo fixa o ambiente e recusa configuração que o possa sobrepor.
          export MIRIFLAGS=""
          cfgs=$(find . "${CARGO_HOME:-$HOME/.cargo}" -maxdepth 3 -path ./target -prune -o \
                   \( -path '*/.cargo/config' -o -path '*/.cargo/config.toml' -o -name config -path "${CARGO_HOME:-$HOME/.cargo}/*" -o -name config.toml -path "${CARGO_HOME:-$HOME/.cargo}/*" \) -print 2>/dev/null || true)
          for c in $cfgs; do
            if grep -nE '^\s*\[env\]|rustflags|MIRIFLAGS|RUSTFLAGS' "$c"; then
              echo "::error::$c pode alterar o Miri (env/rustflags) — o gate do TD-027 recusa correr sob configuração externa."
              exit 1
            fi
          done
          echo "ambiente efetivo: MIRIFLAGS='${MIRIFLAGS}' RUSTFLAGS='${RUSTFLAGS:-}' CARGO_ENCODED_RUSTFLAGS='${CARGO_ENCODED_RUSTFLAGS:-}'"
          if [ -n "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}" ]; then
            echo "::error::RUSTFLAGS definido — o gate do TD-027 corre sem flags externas."
            exit 1
          fi
          CRATE=crates/audio-core
          [ -d "$CRATE" ] || { echo "::error::$CRATE não existe — a guarda seria vácua."; exit 1; }
          ALLOW='        let iters: u64 = if cfg!(miri) { 200 } else { 20_000 };'
          # Sem `-I`: um NUL faria o grep tratar o ficheiro como binário e saltá-lo (Z5a').
          mencoes=$(grep -rnia 'miri' "$CRATE" | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
          outras=$(printf '%s\n' "$mencoes" | awk -v f="$MOD" -v a="$ALLOW" 'NF { ln=$0; split(ln, p, ":");
                     sub(/^[^:]*:[^:]*:/, "", ln); if (!(p[1] == f && ln == a)) print $0 }')
          if [ -n "$outras" ]; then
            echo "$outras"
            echo "::error::$CRATE menciona miri fora da linha permitida — o gate do TD-027 não aceita código condicionado ao Miri."
            exit 1
          fi
          # A linha permitida tem de existir: a sua ausência é sinal de que o ficheiro deixou de ser lido.
          if ! printf '%s\n' "$mencoes" | awk -v f="$MOD" -v a="$ALLOW" '{ ln=$0; split(ln, p, ":");
                 sub(/^[^:]*:[^:]*:/, "", ln); if (p[1] == f && ln == a) ok=1 } END { exit !ok }'; then
            echo "::error::a linha permitida não foi encontrada em $MOD — a guarda deixou de ver o ficheiro."
            exit 1
          fi
          # Código trazido de fora do crate escapa à guarda por texto (Z5c).
          if grep -rnaE 'include!\(|#\[path' "$CRATE"; then
            echo "::error::$CRATE usa include!/#[path] — código de fora do crate escaparia à guarda do TD-027."
            exit 1
          fi

          set +e
          cargo +nightly-2026-06-02 miri test -p audio-core --locked --lib "$FILTRO" -- --list > "$OUT/miri-list.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then cat "$OUT/miri-list.txt"; echo "::error::listagem falhou (exit $code)"; exit "$code"; fi
          esperado=$(grep -c ': test$' "$OUT/miri-list.txt" || true)

          set +e
          cargo +nightly-2026-06-02 miri test -p audio-core --locked --lib "$FILTRO" > "$OUT/miri-audio-core.txt" 2>&1
          code=$?
          set -e
          cat "$OUT/miri-audio-core.txt"
          if [ "$code" -ne 0 ]; then
            # Só diagnóstico: o veredito já é o `exit "$code"` abaixo, e o pipefail não pode trocá-lo por 141.
            set +o pipefail
            grep -aoE 'Undefined Behavior: [^\n]+' "$OUT/miri-audio-core.txt" | head -5 | \
              while IFS= read -r ub; do printf '::error::%s\n' "$ub"; done
            exit "$code"
          fi
          executado=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$OUT/miri-audio-core.txt" \
                      | grep -aoE '[0-9]+' | awk '{s+=$1} END {print s+0}')

          if [ "$esperado" -lt "$PISO" ]; then
            echo "::error::Miri audio-core: ${esperado} testes listados, piso ${PISO} (KB-012)."
            exit 1
          fi
          if [ "$executado" -ne "$esperado" ]; then
            echo "::error::Miri audio-core: ${executado} executados, ${esperado} esperados (KB-012)."
            exit 1
          fi
          # O único teste com duas threads é o que exercita o `unsafe impl Sync` e a ordem
          # Release/Acquire; tem de constar como executado, pelo nome.
          if ! grep -q 'ring_buffer::tests::spsc_stress_no_loss_or_reorder_under_threads \.\.\. ok' "$OUT/miri-audio-core.txt"; then
            echo "::error::o teste SPSC com threads não executou sob Miri."
            exit 1
          fi
          echo "miri audio-core: ${executado}/${esperado} testes (piso ${PISO}), exit ${code}"

  # ── Não-bloqueante: Windows é suportado, mas não conduz o design ─────────────
  windows:
    name: windows (allow-failure)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
