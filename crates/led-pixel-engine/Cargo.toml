[package]
name = "led-pixel-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The render core: effects → per-pixel colors in logical space, with a lock-free render→send handoff."

[dependencies]
led-core = { path = "../led-core" }
# O triple buffer vive num leaf próprio (`led-triple`) para as suas 5 `unsafe` ficarem
# sob Miri isoladas do resto do crate. Aqui é RE-EXPORTADO como `triple`, por isso
# `crate::triple::…` continua a resolver e nenhum consumidor muda.
led-triple = { path = "../led-triple" }
# RT-LOCK-RENDER-001 (TD-002) e TD-030: scalars() é servido por um latch de sequência
# próprio (src/seqlock.rs, sem unsafe). O arc-swap saiu: o TD-030 mediu-o a devolver um
# snapshot de OUTRA instância (arc-swap 1.9.1).

# GPU executor — hardware-gated; only activates when `--features gpu` is passed.
# Requires a physical GPU + wgpu-compatible driver. CI runs without this feature.
# The CPU ComputeEffect is the always-available reference; this feature adds a
# wgpu dispatcher that runs the same WGSL kernel on the GPU.
[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies.wgpu]
version = "22"
optional = true

[dependencies.pollster]
version = "0.3"
optional = true

[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[dev-dependencies]
led-hal = { path = "../led-hal" }
led-audio = { path = "../led-audio" }

# loom (TD-030): só com RUSTFLAGS="--cfg loom"; modela o latch de src/seqlock.rs.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
