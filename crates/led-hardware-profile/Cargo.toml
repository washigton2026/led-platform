[package]
name = "led-hardware-profile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Design-time capability descriptor for a hardware node (ADR-0018). Pure data: no logic, no HAL, no drivers."

# Leaf by design (ADR-0018 / HardwareProfileGuardian check 4): the only dependency is the
# seam crate, for ColorFormat/WhiteMode (ADR-0011). It must NEVER depend on led-hal,
# led-protocols, led-pixel-engine or led-sequencer — the profile declares, the driver executes.
[dependencies]
led-core = { path = "../led-core" }
